<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>புதுக்கோட்டை பதசஞ்சலன் பதிவு</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Tamil:wght@600;800&family=Hind+Madurai:wght@400;500;600&display=swap">
<style>
/* Layout: banner image on a bhagwa field, title plate overlapping it, form in three numbered-free sections */
:root{
  --bg:#F7F3EE; --surface:#FFFFFF; --ink:#2A1A14; --muted:#7A675D; --line:#E9DDD1;
  --bhagwa:#E8701A; --bhagwa-deep:#B9480D; --on-bhagwa:#FFFFFF; --field:#FBF8F4;
  --soft:#FDEEE1; --ok:#2E7D4F; --warn:#B45309; --plate:#FFFFFF; --shadow:0 10px 30px -14px rgba(120,50,10,.35);
  --display:"Noto Serif Tamil","Hind Madurai",Georgia,serif;
  --body:"Hind Madurai","Noto Sans Tamil",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17110E; --surface:#221915; --ink:#F4EAE2; --muted:#B8A69B; --line:#3A2C25;
  --bhagwa:#F2862F; --bhagwa-deep:#F2A060; --on-bhagwa:#1A110C; --field:#1C1511;
  --soft:#3A2416; --ok:#6FCF97; --warn:#F5B454; --plate:#221915; --shadow:0 10px 30px -14px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17110E; --surface:#221915; --ink:#F4EAE2; --muted:#B8A69B; --line:#3A2C25;
  --bhagwa:#F2862F; --bhagwa-deep:#F2A060; --on-bhagwa:#1A110C; --field:#1C1511;
  --soft:#3A2416; --ok:#6FCF97; --warn:#F5B454; --plate:#221915; --shadow:0 10px 30px -14px rgba(0,0,0,.7); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#C8550F}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.hero{background:linear-gradient(180deg,#F08A2A 0%,#D25A10 100%)}
.hero .wrap{padding-block:16px 64px}
.hero img{display:block;width:100%;max-width:100%;aspect-ratio:2/1;object-fit:cover;border-radius:10px;box-shadow:0 12px 28px -12px rgba(60,20,0,.55)}
.plate{position:relative;margin-top:-62px;background:var(--plate);border-radius:14px;box-shadow:var(--shadow);text-align:center;padding:20px 16px 18px;border-top:4px solid var(--bhagwa)}
.org{font:800 min(1.5rem,5.1vw)/1.3 var(--display);margin:0;color:var(--bhagwa-deep);white-space:nowrap}
.dist{margin:4px 0 12px;font-size:1rem;color:var(--muted);letter-spacing:.02em}
.rule{display:flex;align-items:center;gap:10px;justify-content:center}
.rule::before,.rule::after{content:"";height:1px;flex:1;max-width:70px;background:var(--line)}
h1{font:800 1.25rem/1.2 var(--display);margin:0;color:var(--ink)}
.year{display:inline-block;margin-left:6px;font:600 .95rem var(--body);color:var(--on-bhagwa);background:var(--bhagwa);padding:2px 10px;border-radius:999px;vertical-align:middle;font-variant-numeric:tabular-nums}

main .wrap{padding-block:18px 56px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.plate{min-width:0;overflow:hidden}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 16px}
.sec{display:grid;gap:14px}
.sec+.sec{border-top:1px dashed var(--line);padding-top:18px;margin-top:4px}
.sec h2{font:600 1.02rem var(--display);margin:0;color:var(--bhagwa-deep);display:flex;align-items:center;gap:8px}
.sec h2::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--bhagwa);transform:rotate(45deg)}
form{display:grid;gap:4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.row{grid-template-columns:1fr}}
label.f{display:grid;gap:5px;font-weight:600;font-size:.92rem;min-width:0}
.lt{display:block}
.newtoggle{display:flex;align-items:center;gap:10px;padding:11px 13px;border:1px dashed var(--ok);border-radius:12px;color:var(--ok);font-weight:600;cursor:pointer}
.newtoggle input{width:20px;height:20px;accent-color:var(--ok);margin:0;flex:none}
.newtoggle:has(input:checked){background:var(--ok);color:var(--on-bhagwa);border-style:solid}
.newtoggle small{font-weight:400;opacity:.85}
#orgBlock,#sanghBlock{display:grid;gap:10px}
#sanghBlock{gap:18px}
.req{color:var(--bhagwa)}
.opt{font-weight:400;font-size:.8rem;color:var(--muted)}
input,select{width:100%;font:16px var(--body);color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:11px 12px;transition:border-color .15s}
input:focus,select:focus{outline:none;border-color:var(--bhagwa);box-shadow:0 0 0 3px var(--soft)}
button:focus-visible{outline:2px solid var(--bhagwa);outline-offset:2px}
fieldset{border:0;margin:0;padding:0;display:grid;gap:8px;min-width:0}
legend{font-weight:600;font-size:.92rem;margin-bottom:8px;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.chip span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:.9rem;background:var(--field);transition:background .15s,color .15s}
.chip input:checked+span{background:var(--bhagwa);color:var(--on-bhagwa);border-color:var(--bhagwa)}
.chip input:focus-visible+span{outline:2px solid var(--bhagwa);outline-offset:2px}
.chip.new span{border-style:dashed;border-color:var(--ok);color:var(--ok)}
.chip.new input:checked+span{background:var(--ok);color:var(--on-bhagwa);border-style:solid}
.clear{justify-self:start;background:none;border:0;color:var(--muted);font:500 .82rem var(--body);padding:0;cursor:pointer;text-decoration:underline}
.btn{margin-top:14px;border:0;border-radius:12px;background:linear-gradient(180deg,var(--bhagwa),var(--bhagwa-deep));color:var(--on-bhagwa);font:800 1.1rem var(--display);padding:14px 18px;cursor:pointer;box-shadow:var(--shadow)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.msg{margin-top:12px;font-size:.92rem;padding:11px 13px;border-radius:10px;background:var(--soft)}
.msg.ok{color:var(--ok)} .msg.err{color:var(--warn)}
.foot{text-align:center;color:var(--muted);font-size:.85rem;margin:0}
.ro{font-size:.88rem;color:var(--muted);margin:8px 0 0}
@media (prefers-reduced-motion:no-preference){.msg{animation:in .25s ease-out}@keyframes in{from{transform:translateY(-4px)}}}
</style>
</head>
<body>


<header class="hero"><div class="wrap">
  <img src="banner.webp" alt="டாக்டர் ஹெட்கேவார், பாரத மாதா, ஸ்ரீ குருஜி">
</div></header>

<main><div class="wrap">
<div class="plate">
  <p class="org">ராஷ்ட்ரீய ஸ்வயம்சேவக சங்கம்</p>
  <p class="dist">புதுக்கோட்டை ஜில்லா</p>
  <div class="rule"><h1>பதசஞ்சலன்<span class="year">2026</span></h1></div>
</div>

<section class="card">
  <form id="reg" novalidate>
    <div class="sec">
      <h2>தனிப்பட்ட விவரம்</h2>
      <label class="f"><span class="lt">பெயர் <span class="req">*</span></span>
        <input id="name" autocomplete="off" placeholder="முழு பெயர்"></label>
      <div class="row">
        <label class="f"><span class="lt">வயது <span class="req">*</span></span>
          <input id="age" type="number" inputmode="numeric" min="5" max="99" placeholder="எ.கா. 24"></label>
        <label class="f"><span class="lt">கைபேசி எண் <span class="req">*</span></span>
          <input id="phone" type="tel" inputmode="numeric" maxlength="10" placeholder="10 இலக்க எண்"></label>
      </div>
      <label class="f"><span class="lt">படிப்பு / தொழில் <span class="opt">(விருப்பம்)</span></span>
        <input id="eduJob" list="eduJobList" placeholder="எ.கா. கல்லூரி மாணவர் / விவசாயம்"></label>
      <datalist id="eduJobList"><option value="பள்ளி மாணவர்"><option value="கல்லூரி மாணவர்"><option value="விவசாயம்"><option value="சொந்த தொழில்"><option value="தனியார் பணி"><option value="அரசு பணி"><option value="கூலி வேலை"><option value="ஆசிரியர்"><option value="ஓய்வு பெற்றவர்"></datalist>
    </div>

    <div class="sec">
      <h2>இருப்பிடம்</h2>
      <label class="f"><span class="lt">ஊர் <span class="req">*</span></span>
        <input id="ooru" autocomplete="off" placeholder="கிராமம் / ஊர் பெயர்"></label>
      <label class="f"><span class="lt">கண்ட / நகர் <span class="req">*</span></span>
        <select id="unit">
          <option value="">— தேர்வு செய்யவும் —</option>
          <optgroup label="நகர்"><option>புதுக்கோட்டை நகர்</option></optgroup>
          <optgroup label="கண்ட">
            <option>புதுக்கோட்டை கண்ட</option><option>திருமயம்</option><option>பொன்னமராவதி</option>
            <option>அன்னவாசல்</option><option>விராலிமலை</option><option>குளத்தூர்</option><option>கந்தர்வகோட்டை</option>
          </optgroup>
        </select></label>
    </div>

    <div class="sec">
      <h2>சங்க தொடர்பு</h2>
      <label class="newtoggle"><input type="checkbox" id="isNew"> <span>புதியவர் <small>· முகாம், அமைப்பு எதுவும் இல்லை</small></span></label>
      <div id="sanghBlock">
      <fieldset>
        <legend>சங்க முகாம் <span class="opt">(முடித்த உயர்ந்த நிலை · விருப்பம்)</span></legend>
        <div class="chips" id="camps"></div>
        <button type="button" class="clear" data-clear="camps" hidden>தேர்வை நீக்கு</button>
      </fieldset>
      <fieldset>
        <legend>தொடர்புடைய அமைப்பு <span class="opt">(விருப்பம்)</span></legend>
        <div id="orgBlock">
          <div class="chips" id="orgs"></div>
          <button type="button" class="clear" data-clear="orgs" hidden>தேர்வை நீக்கு</button>
          <label class="f"><span class="lt">அமைப்பு — <span class="opt">பட்டியலில் இல்லையெனில் எழுதவும்</span></span>
            <input id="other" autocomplete="off" placeholder="அமைப்பின் பெயர்"></label>
        </div>
      </fieldset>
      </div>
    </div>

    <div id="formMsg" class="msg" hidden></div>
    <button class="btn" id="submitBtn" type="submit">பதிவு செய்</button>
  </form>
</section>
<p class="foot" id="count"><span class="req">*</span> குறியிட்டவை கட்டாயம்</p>
</div></main>

<script>
const ORGS=["RSS","VHP","BJP","ABVP","ABGP","இந்து முன்னணி","சேவாபாரதி","வித்யா பாரதி","சுதேசி ஜாக்ரண் மஞ்ச்","விஞ்ஞான் பாரதி","பாரதிய கிசான் சங்கம்","BMS","இந்து ஆலய பாதுகாப்பு இயக்கம்"];
const CAMPS=["ப்ராரம்பிக்","ப்ராத்தமிக்","சங்க சிக்ஷா வர்க","கார்யகர்த்தா விகாஸ் வர்க 1","கார்யகர்த்தா விகாஸ் வர்க 2"];
const NEW="புதியவர்";
const $=id=>document.getElementById(id);
const SB_URL="https://efvcsxgzxkfcqjhgvniz.supabase.co", SB_KEY="sb_publishable_pER5Dv8ToteXfq-Vxt-l_A_I0GIvFDF";
let done=0;

function chips(el,list,name,newVal){
  list.forEach((o,i)=>{
    const l=document.createElement("label");l.className="chip"+(o===newVal?" new":"");
    l.innerHTML=`<input type="radio" name="${name}" id="${name}${i}"><span></span>`;
    l.querySelector("span").textContent=o;l.querySelector("input").value=o;el.appendChild(l);
  });
}
chips($("camps"),CAMPS,"camp");
chips($("orgs"),ORGS,"org");
const picked=id=>($(id).querySelector("input:checked")||{}).value||"";
function syncClear(){
  document.querySelectorAll("[data-clear]").forEach(b=>b.hidden=!picked(b.dataset.clear));
  $("sanghBlock").hidden=$("isNew").checked;
}
document.addEventListener("change",e=>{
  if(e.target.name==="org"&&e.target.checked)$("other").value="";
  if(e.target.id==="isNew"&&e.target.checked){document.querySelectorAll("#camps input,#orgs input").forEach(i=>i.checked=false);$("other").value=""}
  if(e.target.type==="radio"||e.target.id==="isNew")syncClear();
});
$("other").addEventListener("input",()=>{if($("other").value.trim()){$("orgs").querySelectorAll("input").forEach(i=>i.checked=false);syncClear()}});
function fitOrg(){const el=document.querySelector(".org"),box=el.parentElement;el.style.fontSize="";
  const avail=box.clientWidth-32;if(avail<=0)return;let s=parseFloat(getComputedStyle(el).fontSize);
  while(el.scrollWidth>avail&&s>11){s-=.5;el.style.fontSize=s+"px"}}
fitOrg();addEventListener("resize",fitOrg);document.fonts&&document.fonts.ready.then(fitOrg);
document.querySelectorAll("[data-clear]").forEach(b=>b.onclick=()=>{
  $(b.dataset.clear).querySelectorAll("input").forEach(i=>i.checked=false);syncClear();
});

function msg(text,kind){const el=$("formMsg");el.textContent=text;el.className="msg "+kind;el.hidden=false}

$("reg").addEventListener("submit",async e=>{
  e.preventDefault();
  const v=id=>$(id).value.trim();
  const isNew=$("isNew").checked;
  const org=isNew?NEW:(picked("orgs")||v("other"));
  const phone=v("phone").replace(/\D/g,"");
  const age=parseInt(v("age"),10);
  const miss=[];
  if(!v("name"))miss.push("பெயர்");
  if(!age||age<5||age>99)miss.push("வயது");
  if(phone.length!==10)miss.push("10 இலக்க கைபேசி எண்");
  if(!v("ooru"))miss.push("ஊர்");
  if(!v("unit"))miss.push("கண்ட / நகர்");
  if(miss.length) return msg("நிரப்ப வேண்டியவை: "+miss.join(", "),"err");
  const rec={name:v("name"),age,edu_job:v("eduJob")||null,ooru:v("ooru"),phone,unit:v("unit"),
    camp:(isNew?"":picked("camps"))||null,org:org||null,is_new:isNew};
  $("submitBtn").disabled=true;
  try{
    const r=await fetch(SB_URL+"/rest/v1/ps_regs",{method:"POST",
      headers:{"apikey":SB_KEY,"Content-Type":"application/json","Prefer":"return=minimal"},
      body:JSON.stringify(rec)});
    if(!r.ok){const t=await r.text().catch(()=>"");throw new Error(r.status+" "+t)}
    $("reg").reset();syncClear();
    done++;$("count").textContent=`இந்த அமர்வில் ${done} பதிவு சேமிக்கப்பட்டது`;
    msg(`✓ ${rec.name} — ${rec.unit} பதிவு சேமிக்கப்பட்டது. அடுத்தவரை பதிவு செய்யலாம்.`,"ok");
  }catch(err){
    msg(/^4\d\d/.test(err.message)?"விவரங்களில் பிழை உள்ளது. சரிபார்த்து மீண்டும் முயற்சிக்கவும்.":"சேமிக்க முடியவில்லை. இணைய இணைப்பை சரிபார்த்து மீண்டும் முயற்சிக்கவும்.","err");
  }finally{$("submitBtn").disabled=false}
});
</script>

</body>
</html>
